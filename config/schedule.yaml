# Ramp-up Schedule
# Controls how many actions per day and which activities are allowed each week.
# This is the most important tuning file — conservative ramp-up is key.

weeks_1_2:
  label: "Foundation"
  actions_per_day: [1, 3]                 # [min, max] chosen randomly each day
  skip_day_probability: 0.15              # 15% chance of no activity (real people take days off)
  allowed_activities:
    - search
    - newsletter_signup                   # Sign up to newsletters early so confirmations arrive naturally
    - calendar_setup                      # One-time setup — creates the initial personal calendar
    - drive_setup                         # One-time setup — creates initial docs and spreadsheet
  activity_weights:
    search: 0.65
    newsletter_signup: 0.13
    calendar_setup: 0.11
    drive_setup: 0.11                    # Runs once then auto-switches to edit mode
  searches_per_session: [2, 4]
  max_session_activities: 3              # Cap per-session activities; remaining run in next slot
  session_gap_hours: [8, 16]             # Long gaps between sessions

weeks_3_4:
  label: "Engagement"
  actions_per_day: [1, 3]                # Per-session (2 sessions/day = 2-6 daily)
  sessions_per_day: 2
  skip_day_probability: 0.10
  allowed_activities:
    - search
    - email_read                          # Start reading/replying to received emails
    - maps_browse                         # Browse Maps listings, view photos, read reviews
    - calendar_browse                     # Browse the calendar naturally
    - calendar_add                        # Occasionally add a new event
    - drive_browse                        # Open Drive, read existing docs
    - drive_edit                          # Edit an existing doc
  activity_weights:
    search: 0.42
    email_read: 0.20
    maps_browse: 0.12
    calendar_browse: 0.09
    calendar_add: 0.04
    drive_browse: 0.08
    drive_edit: 0.05
  searches_per_session: [2, 5]
  max_session_activities: 3
  session_gap_hours: [5, 10]

weeks_5_6:
  label: "Active"
  actions_per_day: [2, 4]                # Per-session (2 sessions/day = 4-8 daily)
  sessions_per_day: 2
  skip_day_probability: 0.10
  allowed_activities:
    - search
    - email_read
    - email_send                          # Start sending outbound emails
    - maps_browse
    - calendar_browse
    - calendar_add
    - drive_browse
    - drive_edit
    - drive_create                        # Start creating new documents
  activity_weights:
    search: 0.33
    email_read: 0.18
    email_send: 0.13
    maps_browse: 0.10
    calendar_browse: 0.07
    calendar_add: 0.03
    drive_browse: 0.08
    drive_edit: 0.05
    drive_create: 0.03
  searches_per_session: [3, 6]
  max_session_activities: 4
  emails_sent_per_session: [1, 2]
  session_gap_hours: [3, 8]

weeks_7_plus:
  label: "Normal Use"
  actions_per_day: [2, 5]                # Per-session (3 sessions/day = 6-15 daily)
  sessions_per_day: 3
  skip_day_probability: 0.08
  allowed_activities:
    - search
    - email_read
    - email_send
    - browse                              # Deeper reading of search result pages
    - maps_browse
    - calendar_browse
    - calendar_add
    - drive_browse
    - drive_edit
    - drive_create
  activity_weights:
    search: 0.26
    email_read: 0.16
    email_send: 0.15
    browse: 0.07
    maps_browse: 0.13
    calendar_browse: 0.07
    calendar_add: 0.03
    drive_browse: 0.07
    drive_edit: 0.04
    drive_create: 0.02
  searches_per_session: [3, 8]
  max_session_activities: 5
  emails_sent_per_session: [1, 4]
  session_gap_hours: [2, 6]

# Multilogin local API settings
multilogin:
  api_base: "http://127.0.0.1:35000"
  start_timeout_seconds: 90

# How long to wait before closing the browser after finishing a session
session_cooldown_seconds: [30, 120]
